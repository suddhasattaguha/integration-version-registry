<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integration Registry — draft 0.3</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1d2433; --muted: #667085; --line: #e3e6ec;
    --head: #1f2a3c; --teal: #0f7c7a; --teal-bg: #e3f3f2; --violet: #6b4fd8; --violet-bg: #efebfd;
    --amber: #b86e00; --amber-bg: #fff3dc; --red: #b42318; --red-bg: #fdecea; --grey-bg: #eef0f3;
    --radius: 8px; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 var(--font); color: var(--ink); background: var(--bg); }
  header { background: var(--head); color: #fff; display: flex; align-items: center; gap: 16px; padding: 10px 20px; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .draft { font-size: 11px; background: rgba(255,255,255,.14); padding: 2px 8px; border-radius: 10px; }
  header nav { display: flex; gap: 4px; margin-left: 12px; }
  header nav button { background: none; border: 0; color: #c9d1de; padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
  header nav button.on, header nav button:hover { background: rgba(255,255,255,.12); color: #fff; }
  header nav button:disabled { opacity: .4; cursor: default; background: none; }
  header .spacer { flex: 1; }
  header .folder { font-size: 12px; color: #c9d1de; max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn { background: var(--teal); color: #fff; border: 0; padding: 7px 14px; border-radius: 6px; cursor: pointer; font: inherit; font-weight: 500; }
  .btn.ghost { background: transparent; color: inherit; border: 1px solid currentColor; opacity: .85; }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: default; }
  main { padding: 20px; max-width: 1400px; margin: 0 auto; }
  .status { font-size: 12px; color: var(--muted); margin: -6px 0 14px; min-height: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
  .panel h2 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }
  .panel h2 .count { color: var(--muted); font-weight: 400; }
  .grid { display: grid; gap: 16px; }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g3 { grid-template-columns: 2fr 1fr; }
  @media (max-width: 900px) { .g4 { grid-template-columns: 1fr 1fr; } .g2, .g3 { grid-template-columns: 1fr; } }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .tile .num { font-size: 26px; font-weight: 600; }
  .tile .lbl { color: var(--muted); font-size: 12px; }
  .tile.warn .num { color: var(--amber); }
  .empty { text-align: center; padding: 70px 20px; color: var(--muted); }
  .empty h2 { color: var(--ink); font-size: 20px; margin-bottom: 8px; }
  .empty p { max-width: 560px; margin: 8px auto; }
  .empty .btn { margin-top: 14px; font-size: 15px; padding: 10px 20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; user-select: none; }
  th.sort { cursor: pointer; }
  th.sort:hover { color: var(--ink); }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: #f7f9fc; }
  td.nowrap { white-space: nowrap; }
  .chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--grey-bg); color: #344054; margin: 1px 3px 1px 0; white-space: nowrap; }
  .chip.teal { background: var(--teal-bg); color: var(--teal); }
  .chip.violet { background: var(--violet-bg); color: var(--violet); }
  .chip.amber { background: var(--amber-bg); color: var(--amber); }
  .chip.red { background: var(--red-bg); color: var(--red); }
  .chip.done { text-decoration: line-through; opacity: .7; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar input[type=search] { flex: 1; min-width: 220px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .toolbar label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .list-item { padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .list-item:last-child { border-bottom: 0; }
  .list-item:hover .t { color: var(--teal); }
  .list-item .t { font-weight: 500; }
  .list-item .s { font-size: 12px; color: var(--muted); }
  .flag { display: flex; gap: 10px; padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; background: var(--amber-bg); }
  .flag.red { background: var(--red-bg); }
  .flag.grey { background: var(--grey-bg); }
  .flag .ico { font-weight: 700; color: var(--amber); }
  .flag.red .ico { color: var(--red); }
  .flag.grey .ico { color: var(--muted); }
  .flag .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .detail-head { display: flex; align-items: flex-start; gap: 16px; }
  .detail-head h2 { font-size: 20px; margin: 0; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .back { background: none; border: 0; color: var(--teal); cursor: pointer; font: inherit; padding: 0; margin-bottom: 10px; }
  .diagram { overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: #fbfcfd; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .ver { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
  .ver .vt { font-weight: 600; }
  .ver dl { display: grid; grid-template-columns: 90px 1fr; gap: 2px 10px; margin: 8px 0 0; font-size: 13px; }
  .ver dt { color: var(--muted); }
  .ver dd { margin: 0; }
  .muted { color: var(--muted); }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .hist a { color: var(--teal); cursor: pointer; text-decoration: underline; }
  .note { font-size: 12px; color: var(--muted); }
  .hidden { display: none !important; }
  .scroll { overflow-x: auto; }
  /* overview 0.2 */
  .tile.click { cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .tile.click:hover, .tile.click:focus-visible { border-color: var(--teal); box-shadow: 0 2px 10px rgba(15,124,122,.12); outline: none; }
  .tile .go { font-size: 11px; color: var(--teal); margin-top: 6px; }
  .tile .split { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .g-map { grid-template-columns: minmax(0, 1fr) 330px; }
  @media (max-width: 1100px) { .g-map { grid-template-columns: 1fr; } }
  .panel-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .panel-head h2 { margin: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { background: #fff; border: 0; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--teal); color: #fff; }
  .map { width: 100%; height: auto; display: block; }
  .map [data-sel] { cursor: pointer; }
  .map .dim { opacity: .16; }
  .map .node:hover rect.box { stroke: var(--teal); }
  .sel-panel h3 { font-size: 15px; margin: 0 0 4px; }
  .sel-panel .kv { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .sel-panel .sec { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin: 12px 0 4px; }
  .linkish { color: var(--teal); cursor: pointer; }
  .linkish:hover { text-decoration: underline; }
  .matrix { border-collapse: separate; border-spacing: 2px; width: auto; }
  .matrix th, .matrix td { border: 0; padding: 0; }
  .matrix th.rh { text-align: right; padding-right: 8px; font-weight: 500; color: var(--ink); max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .matrix th.ch { width: 30px; text-align: center; font-size: 11px; }
  .matrix td.c { width: 30px; height: 26px; text-align: center; font-size: 12px; border-radius: 4px; background: var(--grey-bg); color: var(--muted); }
  .matrix td.c.n { cursor: pointer; color: #fff; font-weight: 600; }
  .matrix td.c.on { outline: 2px solid var(--ink); }
  .matrix td.d { background: transparent; }
  .src-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(255,255,255,.14); }
  .banner { background: var(--amber-bg); color: var(--amber); padding: 8px 12px; border-radius: 6px; display: inline-block; font-size: 12px; }
  /* ===== draft 0.3: bands + worlds ===== */
  body { background: radial-gradient(1200px 600px at 20% -10%, #eef3fa 0%, transparent 60%), radial-gradient(900px 500px at 100% 0%, #f1eefb 0%, transparent 55%), var(--bg); background-attachment: fixed; }
  .home { display: flex; flex-direction: column; gap: 18px; padding: 6px 0 28px; perspective: 1600px; transform-origin: 50% 20%;
    transition: transform .7s cubic-bezier(.16,1,.3,1), opacity .55s ease, filter .6s ease; }
  .home.recede { transform: scale(.93) translateY(14px); opacity: .14; filter: saturate(.2) blur(2px); pointer-events: none; }
  .home.instant { transition: none !important; }
  .band { position: relative; display: flex; align-items: center; gap: 24px; min-height: 124px; padding: 22px 32px; border-radius: 22px; cursor: pointer; overflow: hidden; outline: none;
    background: linear-gradient(140deg, #ffffff 0%, #f6f8fc 55%, #eef2f8 100%);
    border: 1px solid rgba(16,24,40,.07);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -2px 0 rgba(16,24,40,.03), 0 1px 2px rgba(16,24,40,.05), 0 18px 40px -22px rgba(16,24,40,.35);
    transform-style: preserve-3d; transition: transform .45s cubic-bezier(.16,1,.3,1), box-shadow .45s cubic-bezier(.16,1,.3,1);
    animation: bandIn .7s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(var(--i) * 70ms); }
  @keyframes bandIn { from { opacity: 0; transform: translateY(18px) rotateX(8deg); } }
  .band::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.55) 48%, rgba(255,255,255,0) 62%); transform: translateX(-60%); transition: transform .9s cubic-bezier(.16,1,.3,1); }
  .band:hover, .band:focus-visible { transform: translateY(-5px) rotateX(4deg); box-shadow: inset 0 1px 0 #fff, 0 2px 4px rgba(16,24,40,.06), 0 34px 60px -26px rgba(16,24,40,.45); }
  .band:hover::after, .band:focus-visible::after { transform: translateX(60%); }
  .band:focus-visible { box-shadow: 0 0 0 3px rgba(15,124,122,.35), 0 34px 60px -26px rgba(16,24,40,.45); }
  .band .deco { position: absolute; right: 120px; top: 50%; width: 220px; height: 220px; transform: translateY(-50%) translateZ(-20px); color: var(--c2); opacity: .06; pointer-events: none; }
  .orb { flex: none; width: 70px; height: 70px; border-radius: 20px; display: grid; place-items: center; color: #fff;
    background: radial-gradient(120% 120% at 30% 20%, var(--c1) 0%, var(--c2) 75%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.4), inset 0 -8px 16px rgba(0,0,0,.22), 0 14px 26px -12px var(--c2), 0 4px 8px -4px rgba(16,24,40,.25);
    transform: translateZ(40px); }
  .orb svg { width: 32px; height: 32px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
  .orb.sm { width: 48px; height: 48px; border-radius: 14px; } .orb.sm svg { width: 24px; height: 24px; }
  .band .big, .world-head .big { font-size: 48px; font-weight: 700; letter-spacing: -2px; line-height: 1; color: #101828; min-width: 84px; transform: translateZ(30px);
    background: linear-gradient(180deg, #1d2433 0%, #475467 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .world-head .big { font-size: 34px; min-width: 0; }
  .band .txt, .world-head .txt { display: flex; flex-direction: column; min-width: 0; transform: translateZ(20px); }
  .band .name { font-size: 20px; font-weight: 650; color: #101828; letter-spacing: -.2px; }
  .world-head .name { font-size: 18px; font-weight: 650; color: #101828; }
  .band .desc, .world-head .desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .apill { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 10px; padding: 11px 18px 11px 14px; border-radius: 16px; color: #7a4600; font-size: 13px; font-weight: 500;
    background: linear-gradient(150deg, #fff8e8 0%, #ffe7b8 100%); border: 1px solid rgba(184,110,0,.18);
    box-shadow: inset 0 1px 0 #fff, 0 10px 22px -12px rgba(184,110,0,.65); transform: translateZ(36px); }
  .apill b { font-size: 26px; font-weight: 700; letter-spacing: -.5px; color: #8a4f00; }
  .apill .ico { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: radial-gradient(120% 120% at 30% 20%, #f5a524, #b86e00); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 0 0 0 rgba(245,165,36,.5); animation: attnPulse 2.4s ease-out infinite; }
  .apill .ico svg { width: 17px; height: 17px; }
  @keyframes attnPulse { 0% { box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 0 0 0 rgba(245,165,36,.45); } 70%, 100% { box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 0 0 10px rgba(245,165,36,0); } }
  .apill.sm { padding: 7px 14px 7px 10px; } .apill.sm b { font-size: 20px; } .apill.sm .ico { width: 24px; height: 24px; }
  .clear { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #2e7d5b; transform: translateZ(30px); }
  .clear .ico { width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; color: #fff; background: radial-gradient(120% 120% at 30% 20%, #3fbf86, #1f7a52); }
  .clear .ico svg { width: 15px; height: 15px; }
  .explore { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: var(--c2); font-weight: 500; transform: translateZ(30px); }
  .explore svg { width: 18px; height: 18px; transition: transform .3s; } .band:hover .explore svg { transform: translateX(4px); }
  /* the morphing card and the world it becomes */
  .morph { position: fixed; z-index: 60; overflow: hidden; pointer-events: none; background: linear-gradient(140deg, #ffffff 0%, #f4f7fb 100%);
    border: 1px solid rgba(16,24,40,.08); box-shadow: 0 40px 80px -30px rgba(16,24,40,.45), 0 2px 6px rgba(16,24,40,.06); }
  .world { background: #fff; border-radius: 20px; border: 1px solid rgba(16,24,40,.08); box-shadow: 0 30px 70px -36px rgba(16,24,40,.4), 0 1px 2px rgba(16,24,40,.04); min-height: calc(100vh - 120px); overflow: hidden; }
  .world-head { display: flex; align-items: center; gap: 16px; padding: 18px 24px; background: linear-gradient(140deg, #ffffff 0%, #f4f7fb 100%); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  .wback { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; cursor: pointer; color: var(--ink); box-shadow: 0 1px 2px rgba(16,24,40,.06); transition: transform .2s, box-shadow .2s; }
  .wback:hover { transform: translateX(-2px); box-shadow: 0 4px 10px -4px rgba(16,24,40,.25); } .wback svg { width: 20px; height: 20px; }
  .world-body { padding: 16px 24px 26px; }
  .world.enter .world-body > .toolbar, .world.enter .world-body > .grid { animation: rise .55s cubic-bezier(.16,1,.3,1) both; animation-delay: .05s; }
  .world.enter tr.r { animation: rise .55s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(min(var(--i), 18) * 30ms + 120ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .pill-toggle { display: inline-flex !important; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 13px; color: var(--muted); user-select: none; }
  .pill-toggle input { display: none; }
  .pill-toggle .ico svg { width: 15px; height: 15px; vertical-align: -3px; }
  .pill-toggle.on { background: var(--amber-bg); border-color: rgba(184,110,0,.35); color: var(--amber); }
  .wtable th { position: sticky; top: 85px; background: #fff; z-index: 1; }
  .wtable td { vertical-align: middle; }
  .wtable th.mk, .wtable td.mk { width: 30px; padding-right: 0; }
  .wtable tr.r { cursor: pointer; transition: background .2s; }
  .wtable tr.r:hover td { background: #f7f9fc; }
  .wtable tr.r.attn td { background: #fffaf0; }
  .wtable tr.r.attn:hover td { background: #fff4de; }
  .wtable tr.r.attn td:first-child { box-shadow: inset 4px 0 0 #f5a524; }
  .wtable tr.r.open td { background: #f2f7f7; border-bottom-color: transparent; }
  .wtable tr.r.attn.open td { background: #fff1d6; }
  .wmark { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; color: #fff; background: radial-gradient(120% 120% at 30% 20%, #f5a524, #b86e00); }
  .wmark svg { width: 13px; height: 13px; }
  .sub2 { margin-top: 2px; }
  td.why { font-size: 12px; color: var(--amber); max-width: 280px; }
  tr.xrow td { padding: 0 !important; border-bottom: 0; background: #fbfcfe; }
  tr.xrow.on td { border-bottom: 1px solid var(--line); }
  .xwrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .55s cubic-bezier(.16,1,.3,1); }
  tr.xrow.on .xwrap { grid-template-rows: 1fr; }
  .xwrap > .xslot { overflow: hidden; min-height: 0; }
  .xin { padding: 14px 18px 16px 46px; opacity: 0; transform: translateY(-6px); transition: opacity .4s .12s, transform .5s .08s cubic-bezier(.16,1,.3,1); }
  tr.xrow.on .xin { opacity: 1; transform: none; }
  .explorer { width: 100%; max-width: 1000px; height: auto; display: block; font-family: var(--font); }
  .explorer .xl { font-size: 11px; fill: #667085; letter-spacing: .4px; text-transform: uppercase; }
  .explorer .xs { font-size: 11px; fill: #667085; }
  .explorer .xe { fill: none; stroke: #b4bcc8; stroke-width: 1.6; }
  .explorer .xe.ov { stroke: #0f7c7a; stroke-dasharray: 5 4; }
  .explorer .xe.attn { stroke: #f5a524; stroke-width: 2.2; }
  .explorer .xe.new { stroke: #6b4fd8; }
  .explorer .xn rect:first-of-type { fill: #fff; stroke: #c9cfd9; stroke-width: 1.2; }
  .explorer .xn text { font-size: 12.5px; fill: #1d2433; }
  .explorer .xn[data-xjump], .explorer .xn[data-mapsel], .explorer .xn[data-open] { cursor: pointer; }
  .explorer .xn[data-xjump]:hover rect:first-of-type, .explorer .xn[data-mapsel]:hover rect:first-of-type, .explorer .xn[data-open]:hover rect:first-of-type { stroke: #0f7c7a; stroke-width: 2; }
  .explorer .xn.ov rect:first-of-type { stroke: #0f7c7a; stroke-dasharray: 4 3; }
  .explorer .xn.attn rect:first-of-type { stroke: #f5a524; fill: #fff8ea; stroke-width: 1.6; }
  .explorer .xn.new rect:first-of-type { stroke: #6b4fd8; fill: #f5f2fe; }
  .explorer .xn.more text { fill: #667085; }
  .explorer .xn.more rect:first-of-type { stroke-dasharray: 2 3; }
  .explorer .xc rect { fill: #0f7c7a; filter: drop-shadow(0 6px 10px rgba(15,124,122,.35)); }
  .explorer .xc.attn rect { fill: #b86e00; filter: drop-shadow(0 6px 10px rgba(184,110,0,.35)); }
  .explorer .xc text { fill: #fff; font-size: 13px; font-weight: 600; }
  .xfoot { display: flex; align-items: flex-start; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
  .xflags { flex: 1; min-width: 280px; } .xflags .flag { margin-bottom: 4px; font-size: 12.5px; }
  .strip line { stroke: #c4cad4; stroke-width: 1.2; } .strip .ov { fill: #fff; stroke: #0f7c7a; stroke-width: 1.4; stroke-dasharray: 2 1.6; }
  .strip .me { fill: #0f7c7a; } .strip .me.attn { fill: #f5a524; }
  .selcard { background: #fbfcfe; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; align-self: start; position: sticky; top: 100px; }
  @media (max-width: 760px) { .band { flex-wrap: wrap; gap: 14px; padding: 18px; } .band .big { font-size: 38px; min-width: 0; } .apill, .clear, .explore { margin-left: 0; } .band .deco { display: none; } }
  @media (prefers-reduced-motion: reduce) { .home, .band, .band::after, .xwrap, .xin { transition: none !important; animation: none !important; } .world.enter tr.r, .world.enter .world-body > * { animation: none !important; } .apill .ico { animation: none; } }
</style>
</head>
<body>
<header>
  <h1 data-act="home" style="cursor:pointer" title="Home">Integration Registry</h1>
  <span class="draft">draft 0.3 · schema 0.5</span>
  <span class="spacer"></span>
  <span class="folder" id="folderName"></span>
  <button class="btn ghost small hidden" id="reloadBtn" title="Read the registry again">Reload</button>
  <button class="btn ghost small hidden" id="ghBtn" title="Go back to the registry folder on GitHub">Back to GitHub</button>
  <button class="btn small" id="openBtn" title="Use a folder on this computer for this browser session only">Open local folder</button>
  <input type="file" id="dirInput" webkitdirectory multiple class="hidden">
</header>
<main>
  <div class="status" id="status"></div>
  <div id="view"></div>
</main>

<script>
"use strict";
/* ============================================================================
   Integration Registry — draft 0.3 (home = bands that open into lists)
   Default source: the registry folder in the GitHub repo (read-only); a local folder can be
   opened for the current browser session instead. Reads a registry folder of Pattern Bench "registry entry" files (schema 0.5),
   keeps index.json as a rebuildable cache, shows overview, directory, components
   and scenario detail with cross-scenario flags. Single self-contained file.
   ========================================================================== */

const APP_VERSION = "0.3";
const INDEX_FILE = "index.json";
const LIFECYCLE_FILE = "lifecycle.json";
const INDEX_SCHEMA = "pattern-bench.registry-index";
const ENTRY_SCHEMA = "pattern-bench.registry-entry";
const RECORD_FORMAT = 2;            // bump when the cached record shape changes

/* Default registry source (R-1): one folder in the GitHub repo. When the app is served from
   <owner>.github.io/<repo>/ the owner and repo are taken from the address. */
const GH = (() => {
  const c = { owner: "suddhasattaguha", repo: "integration-version-registry", branch: "main", path: "registry-data" };
  try {
    const h = location.hostname;
    if (h.endsWith(".github.io")) {
      c.owner = h.split(".")[0];
      const seg = location.pathname.split("/").filter(Boolean)[0];
      if (seg && !seg.includes(".")) c.repo = seg;
    }
  } catch (_) {}
  return c;
})();

const S = {
  source: "",          // "github" (default) | "local" (this session only)
  ghError: "",
  root: null,          // FileSystemDirectoryHandle (Chrome / Edge) or null
  writable: false,
  folderName: "",
  files: new Map(),    // path -> { getFile: () => Promise<File> }
  records: [],         // compact record per spec file
  scenarios: new Map(),// id -> { latest, history: [records sorted desc] }
  lifecycle: null,     // { byKey: Map("ref@v" -> latest event), events }
  refs: new Map(),     // ref -> aggregated info
  specCache: new Map(),// path -> parsed full spec
  view: "overview", param: null,
  listSort: { key: "flags", dir: -1 }, listQuery: "", listFlagsOnly: false,
  compQuery: "", compShared: false, compAttn: false,
  assets: new Map(),   // container ref -> aggregated asset info
  mapMode: "asset", mapAll: false, sel: null,   // overview relationship map
  decQuery: "", decOpenOnly: true,
};

/* ---------- small helpers ---------- */
const $ = (sel) => document.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const vnum = (v) => parseInt(String(v ?? "").replace(/[^0-9]/g, ""), 10) || 0;
const uniq = (a) => [...new Set(a.filter((x) => x !== undefined && x !== null && x !== ""))];
const fmtDate = (iso) => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? String(iso) : d.toISOString().slice(0, 10); };
const chips = (arr, cls = "") => arr.map((x) => `<span class="chip ${cls}">${esc(x)}</span>`).join("");
const STAGE_LABEL = { planned: "planned", inTest: "in test", inProduction: "in production", deprecated: "deprecated", retired: "retired" };
const stageChip = (st) => {
  if (!st) return "";
  const cls = { planned: "", inTest: "teal", inProduction: "teal", deprecated: "amber", retired: "red" }[st] || "";
  return `<span class="chip ${cls}">${esc(STAGE_LABEL[st] || st)}</span>`;
};
function setStatus(t) { $("#status").textContent = t || ""; }

/* ============================================================================
   1. Reading the folder
   ========================================================================== */
// The folder picker is blocked when the page runs inside a preview frame (e.g. a chat or
// file preview). Then fall back to the read-only folder upload, which works everywhere.
let inFrame = false;
try { inFrame = window.self !== window.top; } catch (_) { inFrame = true; }
const canPick = () => !!window.showDirectoryPicker && !inFrame;

/* ---- default source: the registry folder in the GitHub repo (read-only) ---- */
async function loadFromGitHub() {
  S.source = "github"; S.root = null; S.writable = false; S.ghError = "";
  const label = `GitHub · ${GH.owner}/${GH.repo}/${GH.path}`;
  setStatus("Reading the registry folder on GitHub …");
  try {
    const api = `https://api.github.com/repos/${GH.owner}/${GH.repo}/git/trees/${encodeURIComponent(GH.branch)}?recursive=1`;
    const r = await fetch(api, { headers: { Accept: "application/vnd.github+json" } });
    if (r.status === 403 || r.status === 429) throw new Error("GitHub's limit for anonymous reads was reached (about 60 per hour). Try again later, or open a local folder.");
    if (r.status === 404) throw new Error(`Repository ${GH.owner}/${GH.repo} not found, or it is private.`);
    if (!r.ok) throw new Error("GitHub answered " + r.status + ".");
    const tree = await r.json();
    const pre = GH.path.replace(/\/+$/, "") + "/";
    const blobs = (tree.tree || []).filter((t) => t.type === "blob" && t.path.startsWith(pre) && t.path.toLowerCase().endsWith(".json"));
    const raw = (p) => `https://raw.githubusercontent.com/${GH.owner}/${GH.repo}/${encodeURIComponent(GH.branch)}/${p.split("/").map(encodeURIComponent).join("/")}`;
    const texts = await Promise.all(blobs.map(async (b) => {
      const res = await fetch(raw(b.path));
      if (!res.ok) throw new Error("Could not read " + b.path + " (" + res.status + ").");
      return [b, await res.text()];
    }));
    const files = new Map(texts.map(([b, text]) => {
      const rel = b.path.slice(pre.length);
      const lm = parseInt(b.sha.slice(0, 8), 16);       // content hash stands in for "last modified"
      return [rel, { getFile: async () => new File([text], rel.split("/").pop(), { lastModified: lm }) }];
    }));
    S.folderName = label;
    await ingest(files);
  } catch (e) {
    const msg = e && e.message ? e.message : String(e);
    S.ghError = /fetch|NetworkError|Load failed/i.test(msg)
      ? "Couldn't reach GitHub from here — you may be offline, or this page is shown in a preview that blocks outside connections."
      : msg;
    S.folderName = ""; S.records = []; S.scenarios = new Map();
    setStatus("");
    renderSource();
    go("overview");
  }
}

function renderSource() {
  const gh = S.source === "github";
  $("#folderName").innerHTML = S.folderName
    ? (gh ? `☁ ${esc(S.folderName)} <span class="src-badge">read-only</span>`
          : `📁 ${esc(S.folderName)} <span class="src-badge">this session${S.writable ? "" : " · read-only"}</span>`)
    : "";
  $("#reloadBtn").classList.toggle("hidden", !(gh ? S.folderName : S.root));
  $("#ghBtn").classList.toggle("hidden", gh);
}

async function openFolder() {
  if (!canPick()) { $("#dirInput").click(); return; }   // fallback: read-only folder upload
  try {
    const h = await window.showDirectoryPicker({ id: "registry", mode: "readwrite" });
    S.root = h; S.folderName = h.name; S.source = "local";
    await loadFromHandle();
  } catch (e) {
    if (e && e.name === "AbortError") return;
    if (e && e.name === "SecurityError") { inFrame = true; $("#dirInput").click(); return; }
    console.error(e); setStatus("Could not open the folder: " + e.message);
  }
}

async function walk(dir, prefix, out) {
  for await (const [name, h] of dir.entries()) {
    const p = prefix ? prefix + "/" + name : name;
    if (h.kind === "directory") { if (!name.startsWith(".")) await walk(h, p, out); }
    else if (name.toLowerCase().endsWith(".json")) out.set(p, { getFile: () => h.getFile(), handle: h });
  }
}

async function loadFromHandle() {
  setStatus("Reading folder …");
  S.writable = false;
  try { S.writable = (await S.root.queryPermission({ mode: "readwrite" })) === "granted"; } catch (_) {}
  const files = new Map();
  await walk(S.root, "", files);
  await ingest(files);
}

function loadFromInput(fileList) {
  const files = new Map();
  let top = "";
  for (const f of fileList) {
    const rel = f.webkitRelativePath || f.name;
    const parts = rel.split("/");
    if (!top && parts.length > 1) top = parts[0];
    const p = parts.length > 1 ? parts.slice(1).join("/") : rel;
    if (p.toLowerCase().endsWith(".json")) files.set(p, { getFile: async () => f });
  }
  S.root = null; S.writable = false; S.folderName = top || "folder"; S.source = "local";
  return ingest(files);
}

const readJson = async (entry) => JSON.parse(await (await entry.getFile()).text());

/* Classify files, reuse the index cache for unchanged spec files, parse the rest. */
async function ingest(files) {
  S.files = files; S.specCache.clear();
  const t0 = performance.now();
  let cache = {};
  const idxEntry = files.get(INDEX_FILE);
  if (idxEntry) {
    try { const idx = await readJson(idxEntry); if (idx.schema === INDEX_SCHEMA && idx.recordFormat === RECORD_FORMAT) cache = idx.files || {}; }
    catch (e) { console.warn("index.json unreadable, rebuilding", e); }
  }
  const records = []; let fromCache = 0, parsed = 0, skipped = 0, errors = [];
  for (const [path, entry] of files) {
    const low = path.toLowerCase();
    if (low === INDEX_FILE || low.split("/").pop() === LIFECYCLE_FILE || low.endsWith(".canvas.json")) continue;
    let f; try { f = await entry.getFile(); } catch (e) { errors.push(path); continue; }
    const c = cache[path];
    if (c && c.lastModified === f.lastModified && c.size === f.size) { records.push(c); fromCache++; continue; }
    if (!low.endsWith(".registry.json") && f.size > 2_000_000) { skipped++; continue; }
    try {
      const spec = JSON.parse(await f.text());
      if (spec.schema !== ENTRY_SCHEMA) { skipped++; continue; }
      records.push(extract(spec, path, f.lastModified, f.size)); parsed++;
    } catch (e) { errors.push(path); }
  }
  // lifecycle record (optional)
  S.lifecycle = null;
  // every lifecycle.json in the folder (root or sub-folders) is merged
  const lcEvents = [];
  for (const [path, entry] of files) if (path.toLowerCase().split("/").pop() === LIFECYCLE_FILE) {
    try { lcEvents.push(...((await readJson(entry)).events || [])); } catch (e) { errors.push(path); }
  }
  if (lcEvents.length) S.lifecycle = buildLifecycle({ events: lcEvents });

  S.records = records;
  derive();
  let saved = "";
  if (S.writable && (parsed > 0 || Object.keys(cache).length !== records.length)) {
    try { await writeIndex(); saved = " · index.json updated"; } catch (e) { saved = " · index.json not written (" + e.message + ")"; }
  }
  const ms = Math.round(performance.now() - t0);
  setStatus(`${S.scenarios.size} scenarios from ${records.length} files — ${parsed} read, ${fromCache} from index${skipped ? ", " + skipped + " other JSON skipped" : ""}` +
    `${S.lifecycle ? " · lifecycle loaded" : ""}${saved}${S.writable ? "" : " · read-only"} · ${ms} ms` +
    (errors.length ? ` · could not read: ${errors.join(", ")}` : ""));
  S.ghError = ""; S.sel = null;
  renderSource();
  go(S.view === "scenario" && !S.scenarios.has(S.param?.id) ? "home" : S.view, S.param);
}

async function writeIndex() {
  const files = {};
  for (const r of S.records) files[r.path] = r;
  const body = { schema: INDEX_SCHEMA, schemaVersion: "0.5", recordFormat: RECORD_FORMAT, app: APP_VERSION,
    builtAt: new Date().toISOString(), note: "Derived cache. Safe to delete; rebuilt from the scenario files.", files };
  const fh = await S.root.getFileHandle(INDEX_FILE, { create: true });
  const w = await fh.createWritable(); await w.write(JSON.stringify(body)); await w.close();
}

/* ============================================================================
   2. Extract a compact record from one registry entry (this is what index.json keeps)
   ========================================================================== */
function extract(spec, path, lastModified, size) {
  const sc = spec.scenario || {}, base = spec.base || {};
  const comps = base.components || [], conts = base.containers || [], versions = spec.versions || [];
  const contById = Object.fromEntries(conts.map((k) => [k.id, k]));
  const compById = Object.fromEntries(comps.map((c) => [c.id, c]));
  for (const v of versions) for (const a of v.added || []) compById[a.id] = a;
  const label = (k) => (k ? (k.asset || k.platform || "") : "");

  const platforms = uniq(conts.filter((k) => k.kind === "iPaaS" || k.kind === "broker").map((k) => k.platform));
  const assets = uniq(conts.filter((k) => k.kind === "iPaaS" || k.kind === "broker").map((k) => k.asset));
  const endApps = uniq(conts.filter((k) => k.kind === "endApp" || k.kind === "caller").map((k) => label(k) || "(unlabelled)"));

  const uses = {};                      // ref -> versions used in this scenario
  const addUse = (ref, ver) => { if (!ref) return; (uses[ref] ||= []); if (!uses[ref].includes(ver)) uses[ref].push(ver); };
  const components = [];
  const pushComp = (c, origin) => {
    const k = contById[c.container];
    components.push({ ref: c.ref || null, name: c.name || "", type: c.type, version: c.version, origin,
      platform: k ? k.platform || "" : "", asset: k ? k.asset || "" : "", kind: k ? k.kind || "" : "", container: c.container, stage: c.stage || null });
  };
  comps.forEach((c) => { addUse(c.ref, c.version); pushComp(c, "base"); });

  const introduced = []; const seen = new Set(); let open = 0, completed = 0;
  for (const v of versions) {
    const isOpen = v.status !== "completed";
    isOpen ? open++ : completed++;
    const d = v.decision || {};
    const intro = (ref, from, to, change) => {
      const key = ref + "@" + to; if (!ref || seen.has(key)) return; seen.add(key);
      introduced.push({ ref, from, to, change: change || "", option: d.option || "", label: v.label || v.id, status: v.status || "open", when: d.when || "", why: d.why || "" });
    };
    for (const ch of v.changed || []) { const c = compById[ch.component]; if (c) { intro(c.ref, ch.from, ch.to, ch.change); if (isOpen) addUse(c.ref, ch.to); } }
    for (const a of v.added || []) {
      if (isOpen) { addUse(a.ref, a.version); pushComp(a, v.id); }
      const baseUse = comps.find((c) => c.ref && c.ref === a.ref);
      if (baseUse && vnum(a.version) > vnum(baseUse.version)) intro(a.ref, baseUse.version, a.version, "");
    }
  }

  const links = uniq([...(base.links || []), ...versions.filter((v) => v.status !== "completed").flatMap((v) => v.addedLinks || [])]
    .filter((l) => l.fromRef && l.toRef).map((l) => l.fromRef + " > " + l.toRef));

  const warnings = [];
  for (const v of versions) for (const im of v.impacts || []) {
    if (im.warning && !im.acknowledged) {
      const c = compById[im.affected];
      warnings.push({ ref: c?.ref || null, text: `${c?.name || c?.type || im.affected}: unacknowledged ⚠ (${im.decision || "pending"}) in "${v.label || v.id}"` });
    }
  }
  const missingRefs = conts.filter((k) => !k.ref).length;
  const unnamed = comps.filter((c) => !c.name).length;

  // assets (containers) this scenario uses, with the component refs inside them
  const containers = conts.map((k) => ({
    key: k.ref || "noref:" + k.id, name: label(k) || "(unlabelled)", platform: k.platform || "", kind: k.kind || "",
    refs: uniq(components.filter((c) => c.container === k.id).map((c) => c.ref)),
  }));
  // every versioning decision, compact (for the cross-scenario Decisions view)
  const cname = (id) => { const c = compById[id]; return c ? c.name || c.type : id; };
  const decisionList = versions.map((v) => {
    const d = v.decision || {};
    return { label: v.label || v.id, status: v.status || "open", option: d.option || "",
      on: cname(v.appliesTo?.component), side: v.appliesTo?.side || "",
      change: uniq((v.changed || []).map((c) => c.change)), why: d.why || "", what: d.what || "", who: d.who || "", when: d.when || "",
      refs: uniq([...(v.changed || []).map((c) => compById[c.component]?.ref), ...(v.added || []).map((a) => a.ref)]),
      warnings: (v.impacts || []).filter((im) => im.warning && !im.acknowledged).length };
  });

  return {
    path, lastModified, size,
    id: sc.id || path, version: Number(sc.version) || 0, name: sc.name || "(unnamed scenario)", description: sc.description || "",
    author: sc.author || "", exportedAt: sc.exportedAt || "", tags: sc.tags || [], mode: sc.source?.mode || "",
    canvas: sc.canvas?.file || "", platforms, assets, endApps,
    decisions: versions.length, openVersions: open, completedVersions: completed,
    uses, introduced, links, components, warnings, missingRefs, unnamed, containers, decisionList,
    acks: (spec.acknowledgements || []).map((a) => a.flag), relations: spec.relations || [],
  };
}

function buildLifecycle(doc) {
  const events = (doc.events || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const byKey = new Map();
  for (const e of events) byKey.set(e.ref + "@" + e.version, e);     // latest event wins
  return { events, byKey };
}

/* ============================================================================
   3. Derive scenarios, refs and flags (in memory, from the latest version of each scenario)
   ========================================================================== */
function derive() {
  const sc = new Map();
  for (const r of S.records) { (sc.get(r.id) || sc.set(r.id, { history: [] }).get(r.id)).history.push(r); }
  for (const s of sc.values()) { s.history.sort((a, b) => b.version - a.version); s.latest = s.history[0]; }
  S.scenarios = sc;

  // refs across latest versions
  const refs = new Map();
  const R = (ref) => refs.get(ref) || refs.set(ref, { ref, names: new Set(), type: "", versions: new Set(), scenarios: new Set(), intro: [] }).get(ref);
  for (const s of sc.values()) {
    const r = s.latest;
    for (const c of r.components) if (c.ref) { const x = R(c.ref); if (c.name) x.names.add(c.name); x.type ||= c.type; x.versions.add(c.version); x.scenarios.add(r.id); }
    for (const i of r.introduced) { const x = R(i.ref); x.versions.add(i.to); x.intro.push({ ...i, scenario: r.id }); }
  }
  for (const x of refs.values()) x.max = Math.max(0, ...[...x.versions].map(vnum));
  for (const s of sc.values()) for (const c of s.latest.components) if (c.ref && refs.has(c.ref)) {
    const x = refs.get(c.ref); x.kind ||= c.kind; x.asset ||= c.asset || c.platform;
  }
  S.refs = refs;

  // assets (platform containers / end applications) across latest versions
  const assets = new Map();
  for (const s of sc.values()) for (const k of s.latest.containers || []) {
    const a = assets.get(k.key) || assets.set(k.key, { key: k.key, name: k.name, platform: k.platform, kind: k.kind, scenarios: new Set(), refs: new Set() }).get(k.key);
    a.scenarios.add(s.latest.id); k.refs.forEach((r) => a.refs.add(r));
  }
  S.assets = assets;

  for (const s of sc.values()) s.flags = flagsFor(s.latest);
}

function scenarioName(id) { return S.scenarios.get(id)?.latest.name || id; }
function refName(ref) { const x = S.refs.get(ref); return x && x.names.size ? [...x.names][0] : ref; }

function flagsFor(r) {
  const flags = [];
  const acked = new Set(r.acks);
  // a) cross-scenario: a newer version of a shared component exists elsewhere
  for (const [ref, vers] of Object.entries(r.uses)) {
    const x = S.refs.get(ref); if (!x) continue;
    const mine = Math.max(...vers.map(vnum));
    const others = x.intro.filter((i) => i.scenario !== r.id && vnum(i.to) > mine);
    if (!others.length) continue;
    const top = others.sort((a, b) => vnum(b.to) - vnum(a.to))[0];
    const key = `crossImpact:${ref}@${top.to}`;
    flags.push({ kind: "impact", sev: "amber", ref, key, acked: acked.has(key),
      text: `${refName(ref)} — ${top.to} introduced in “${scenarioName(top.scenario)}” (${[top.change, top.option].filter(Boolean).join(", ") || "new version"}). This flow is on ${vers.join(", ")}.` });
  }
  // b) lifecycle: uses a deprecated or retired version
  if (S.lifecycle) for (const [ref, vers] of Object.entries(r.uses)) for (const v of vers) {
    const e = S.lifecycle.byKey.get(ref + "@" + v); if (!e) continue;
    if (e.stage === "retired") {
      const key = `retired:${ref}@${v}`;
      flags.push({ kind: "lifecycle", sev: "red", ref, key, acked: acked.has(key), text: `${refName(ref)} ${v} is retired (${e.date}). Design out of date — remove ${v} in Pattern Bench.` });
    } else if (e.stage === "deprecated") {
      const key = `deprecated:${ref}@${v}`;
      flags.push({ kind: "lifecycle", sev: "amber", ref, key, acked: acked.has(key), text: `${refName(ref)} ${v} is deprecated${e.retireOn ? ", retires on " + e.retireOn : ""}.` });
    }
  }
  // c) open warnings inside the design
  for (const w of r.warnings) flags.push({ kind: "warning", sev: "amber", ref: w.ref, key: "warn:" + w.text, acked: false, text: w.text });
  // d) data quality
  if (r.missingRefs) flags.push({ kind: "data", sev: "grey", ref: null, key: "data:refs", acked: false, text: `${r.missingRefs} container(s) without platform / asset label — those components can't be traced across scenarios.` });
  return flags;
}
const activeFlags = (s) => s.flags.filter((f) => !f.acked && f.sev !== "grey");

/* ============================================================================
   4. Views
   ========================================================================== */
function go(view, param, opts = {}) {
  S.view = view; S.param = param || null;
  const v = $("#view");
  if (!S.records.length && !S.folderName) { v.innerHTML = emptyView(); return; }
  if (view === "scenario") { v.innerHTML = `<div class="panel">Loading …</div>`; scenarioView(param).then((h) => { if (S.view === "scenario") v.innerHTML = h; }); }
  else if (view === "band") v.innerHTML = worldView(param.k, opts.enter);
  else { S.view = "home"; v.innerHTML = homeView(); }
  if (!opts.keepScroll) window.scrollTo(0, 0);
}

function emptyView() {
  const fs = canPick();
  if (!S.ghError && S.source === "github") return `<div class="empty"><h2>Reading the registry on GitHub …</h2>
    <p class="note">${esc(GH.owner)}/${esc(GH.repo)} · folder <code>${esc(GH.path)}/</code></p></div>`;
  return `<div class="empty">
    ${S.ghError ? `<p class="banner">${esc(S.ghError)}</p>` : ""}
    ${inFrame ? `<p class="banner">Shown inside a preview window: a local folder opens read-only (no index cache). For the full app, open the file directly in Chrome or Edge.</p>` : ""}
    <h2>Registry not loaded</h2>
    <p>By default the app reads the registry folder on GitHub: <code>${esc(GH.owner)}/${esc(GH.repo)}/${esc(GH.path)}/</code>.</p>
    <p>You can also open a folder on this computer for this browser session — it holds the files exported from Pattern Bench (<code>*.registry.json</code>). Sub-folders are read too.</p>
    <p class="note">${fs ? "In a local folder the app keeps a small <code>index.json</code> as a cache; the browser asks once for permission to save it."
      : "This browser can't write to folders, so a local folder opens read-only (no index cache). Chrome or Edge give the full experience."}</p>
    <button class="btn" data-act="github">Try GitHub again</button>

/* ---------- overview helpers ---------- */
const KIND = {
  iPaaS: { label: "iPaaS", col: "#0f7c7a" }, broker: { label: "Message broker", col: "#6b4fd8" },
  endApp: { label: "End application", col: "#8a94a6" }, caller: { label: "Caller", col: "#8a94a6" },
};
const kindInfo = (k) => KIND[k] || { label: k || "other", col: "#b0b7c3" };
const flaggedRefs = (s) => new Set(activeFlags(s).map((f) => f.ref).filter(Boolean));
const openIntroRefs = (r) => new Set(r.introduced.filter((i) => i.status !== "completed").map((i) => i.ref));
const short = (t, n) => { t = String(t ?? ""); return t.length > n ? t.slice(0, n - 1) + "…" : t; };

/* Graph for the relationship map: scenarios (left) ↔ assets or components (right). */
function mapGraph() {
  const scen = [...S.scenarios.values()];
  const targets = new Map(), edges = [];
  if (S.mapMode === "asset") {
    for (const a of S.assets.values()) if (S.mapAll || a.scenarios.size > 1) targets.set(a.key, { id: a.key, name: a.name, sub: a.platform || kindInfo(a.kind).label, kind: a.kind, n: a.scenarios.size });
    for (const s of scen) {
      const r = s.latest, fl = flaggedRefs(s), op = openIntroRefs(r);
      for (const k of r.containers || []) if (targets.has(k.key)) edges.push({ s: r.id, t: k.key, w: Math.max(1, k.refs.length),
        flag: k.refs.some((x) => fl.has(x)), ver: k.refs.some((x) => op.has(x)), label: k.refs.length + " comp." });
    }
  } else {
    for (const x of S.refs.values()) if (S.mapAll || x.scenarios.size > 1)
      targets.set(x.ref, { id: x.ref, name: refName(x.ref), sub: [x.type, x.asset].filter(Boolean).join(" · "), kind: x.kind, n: x.scenarios.size });
    for (const s of scen) {
      const r = s.latest, fl = flaggedRefs(s), op = openIntroRefs(r);
      for (const [ref, vers] of Object.entries(r.uses)) if (targets.has(ref))
        edges.push({ s: r.id, t: ref, w: 1, flag: fl.has(ref), ver: op.has(ref), label: vers.join("+") });
    }
  }
  // order both columns by barycentre to reduce crossings
  let L = scen.map((s) => s.latest.id).sort((a, b) => scenarioName(a).localeCompare(scenarioName(b)));
  let R = [...targets.keys()].sort((a, b) => targets.get(b).n - targets.get(a).n || String(targets.get(a).name).localeCompare(String(targets.get(b).name)));
  const bary = (ids, other, key, okey) => {
    const pos = new Map(other.map((id, i) => [id, i]));
    const score = new Map(ids.map((id, i) => {
      const ps = edges.filter((e) => e[key] === id).map((e) => pos.get(e[okey])).filter((p) => p !== undefined);
      return [id, ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : i];
    }));
    return ids.slice().sort((a, b) => score.get(a) - score.get(b));
  };
  for (let i = 0; i < 3; i++) { R = bary(R, L, "t", "s"); L = bary(L, R, "s", "t"); }
  return { L, R, targets, edges };
}

/* What the current selection highlights. */
function selection(g) {
  const sel = S.sel; if (!sel) return null;
  const pS = new Set(), sS = new Set(), pT = new Set(), eOn = new Set();
  if (sel.type === "s") {
    pS.add(sel.id);
    g.edges.forEach((e, i) => { if (e.s === sel.id) { pT.add(e.t); eOn.add(i); } });
    g.edges.forEach((e, i) => { if (e.s !== sel.id && pT.has(e.t)) { sS.add(e.s); eOn.add(i); } });
  } else if (sel.type === "t") {
    pT.add(sel.id);
    g.edges.forEach((e, i) => { if (e.t === sel.id) { pS.add(e.s); eOn.add(i); } });
  } else if (sel.type === "p") {
    pS.add(sel.a); pS.add(sel.b);
    const ta = new Set(g.edges.filter((e) => e.s === sel.a).map((e) => e.t));
    g.edges.forEach((e) => { if (e.s === sel.b && ta.has(e.t)) pT.add(e.t); });
    g.edges.forEach((e, i) => { if (pS.has(e.s) && pT.has(e.t)) eOn.add(i); });
  }
  return { pS, sS, pT, eOn };
}

function mapSvg(g) {
  const W = 960, NW = 270, NH = 40, GAP = 10, TOP = 34, x1 = 4, x2 = W - NW - 4;
  const rows = Math.max(g.L.length, g.R.length, 1);
  const H = TOP + rows * (NH + GAP) + 6;
  const yOf = (i, n) => TOP + (rows - n) * (NH + GAP) / 2 + i * (NH + GAP);
  const yl = new Map(g.L.map((id, i) => [id, yOf(i, g.L.length)]));
  const yr = new Map(g.R.map((id, i) => [id, yOf(i, g.R.length)]));
  const hl = selection(g);
  const font = getComputedStyle(document.body).fontFamily.replace(/"/g, "'");
  let svg = `<svg class="map" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="${font}" role="img" aria-label="Relationship map">
    <text x="${x1}" y="16" font-size="11" fill="#667085" font-weight="600">SCENARIOS (${g.L.length})</text>
    <text x="${x2}" y="16" font-size="11" fill="#667085" font-weight="600">${S.mapMode === "asset" ? "ASSETS" : "COMPONENTS"}${S.mapAll ? "" : " — shared only"} (${g.R.length})</text>`;
  // edges first
  g.edges.forEach((e, i) => {
    if (!yl.has(e.s) || !yr.has(e.t)) return;
    const ya = yl.get(e.s) + NH / 2, yb = yr.get(e.t) + NH / 2, xa = x1 + NW, xb = x2, mx = (xa + xb) / 2;
    const col = e.flag ? "#b86e00" : e.ver ? "#6b4fd8" : "#9aa4b5";
    const on = hl ? hl.eOn.has(i) : true;
    const secondary = hl && hl.sS.has(e.s);
    svg += `<path d="M${xa} ${ya} C${mx} ${ya} ${mx} ${yb} ${xb} ${yb}" fill="none" stroke="${col}" stroke-width="${(1 + Math.min(e.w, 6) * 0.5).toFixed(1)}"
      ${secondary ? 'stroke-dasharray="5 4"' : ""} class="${on ? "" : "dim"}" opacity="${hl ? (on ? 0.95 : 1) : 0.6}"><title>${esc(scenarioName(e.s))} → ${esc(g.targets.get(e.t).name)} · ${esc(e.label)}${e.flag ? " · flagged" : ""}${e.ver ? " · open new version" : ""}</title></path>`;
  });
  // scenario nodes
  for (const id of g.L) {
    const s = S.scenarios.get(id), r = s.latest, y = yl.get(id), nf = activeFlags(s).length;
    const on = !hl || hl.pS.has(id) || hl.sS.has(id), prim = hl && hl.pS.has(id), sec = hl && hl.sS.has(id);
    svg += `<g class="node ${on ? "" : "dim"}" data-sel="s|${esc(id)}" tabindex="0">
      <rect class="box" x="${x1}" y="${y}" width="${NW}" height="${NH}" rx="7" fill="${prim ? "#e3f3f2" : "#fff"}" stroke="${prim ? "#0f7c7a" : sec ? "#0f7c7a" : "#c9cfd9"}" stroke-width="${prim ? 2 : 1.2}" ${sec ? 'stroke-dasharray="4 3"' : ""}/>
      <text x="${x1 + 10}" y="${y + 16}" font-size="12.5" font-weight="600" fill="#1d2433">${esc(short(r.name, 34))}</text>
      <text x="${x1 + 10}" y="${y + 31}" font-size="10.5" fill="#667085">${r.components.length} comp. · ${r.openVersions} open decision${r.openVersions === 1 ? "" : "s"}</text>
      ${nf ? `<text x="${x1 + NW - 10}" y="${y + 24}" font-size="12" text-anchor="end" fill="#b86e00" font-weight="600">⚠ ${nf}</text>` : ""}
      <title>${esc(r.name)} — click to see its relationships</title></g>`;
  }
  // asset / component nodes
  for (const id of g.R) {
    const t = g.targets.get(id), y = yr.get(id), k = kindInfo(t.kind);
    const on = !hl || hl.pT.has(id), prim = hl && S.sel.type === "t" && S.sel.id === id;
    svg += `<g class="node ${on ? "" : "dim"}" data-sel="t|${esc(id)}" tabindex="0">
      <rect class="box" x="${x2}" y="${y}" width="${NW}" height="${NH}" rx="7" fill="${prim ? "#e3f3f2" : "#fff"}" stroke="${prim ? "#0f7c7a" : "#c9cfd9"}" stroke-width="${prim ? 2 : 1.2}"/>
      <rect x="${x2}" y="${y}" width="5" height="${NH}" rx="2" fill="${k.col}"/>
      <text x="${x2 + 14}" y="${y + 16}" font-size="12.5" font-weight="600" fill="#1d2433">${esc(short(t.name, 30))}</text>
      <text x="${x2 + 14}" y="${y + 31}" font-size="10.5" fill="#667085">${esc(short(t.sub, 36))}</text>
      <title>${esc(t.name)} — used by ${t.n} scenario${t.n === 1 ? "" : "s"}</title></g>`;
  }
  return svg + "</svg>";
}

/* Side panel for the current selection. */
function selPanel(g) {
  const sel = S.sel;
  if (!sel) return `<h2>Selection</h2><div class="muted">Click a scenario, ${S.mapMode === "asset" ? "an asset" : "a component"} or a matrix cell to see how they relate.</div>
    <div class="sec">Reading the map</div>
    <div class="note">Lines = “uses”. Thicker = more components in that asset. <span style="color:#6b4fd8">Violet</span> = an open decision brings a new version there. <span style="color:#b86e00">Amber</span> = flagged. <b>×n</b> = shared by n scenarios.</div>`;
  const tname = (id) => g.targets.get(id)?.name || id;
  if (sel.type === "s") {
    const s = S.scenarios.get(sel.id); if (!s) return "";
    const r = s.latest, mine = new Set(g.edges.filter((e) => e.s === r.id).map((e) => e.t));
    const shares = [];
    for (const o of S.scenarios.values()) {
      if (o.latest.id === r.id) continue;
      const common = g.edges.filter((e) => e.s === o.latest.id && mine.has(e.t)).map((e) => e.t);

      <div class="sec">Overlaps with (${shares.length})</div>
      ${shares.map((x) => `<div class="list-item" data-sel="p|${esc(r.id)}|${esc(x.o.id)}"><div class="t">${esc(x.o.name)}</div>
        <div class="s">shares ${x.common.length}: ${esc(x.common.map(tname).slice(0, 4).join(", "))}${x.common.length > 4 ? " …" : ""}</div></div>`).join("") || '<div class="muted">No overlap with other scenarios.</div>'}
      ${fl.length ? `<div class="sec">Flags (${fl.length})</div>${fl.slice(0, 3).map((f) => `<div class="flag ${f.sev === "red" ? "red" : ""}"><span class="ico">⚠</span><div style="font-size:12px">${esc(f.text)}</div></div>`).join("")}` : ""}
    </div>`;
  }
  if (sel.type === "t") {
    const t = g.targets.get(sel.id); if (!t) return "";
    const users = g.edges.filter((e) => e.t === sel.id);
    let comps = "";
    if (S.mapMode === "asset") {
      const a = S.assets.get(sel.id);
      comps = [...(a?.refs || [])].map((ref) => {
        const x = S.refs.get(ref); if (!x) return "";
        return `<div class="list-item" style="cursor:default"><div class="t">${esc(refName(ref))} <span class="muted" style="font-weight:400">${esc(x.type)}</span></div>
          <div class="s">${[...x.scenarios].map((id) => { const v = S.scenarios.get(id).latest.uses[ref] || [];
            return `<span class="chip ${Math.max(...v.map(vnum)) < x.max ? "amber" : ""}">${esc(short(scenarioName(id), 22))} · ${esc(v.join("+"))}</span>`; }).join("")}</div></div>`;
      }).join("");
    } else {
      const x = S.refs.get(sel.id);
      comps = `<div class="note">Versions in the registry: ${[...x.versions].sort((a, b) => vnum(a) - vnum(b)).map((v) => `<span class="chip ${vnum(v) === x.max && x.versions.size > 1 ? "violet" : ""}">${esc(v)}</span>`).join("")}</div>`;
    }
    return `<div class="sel-panel"><h3>${esc(t.name)}</h3>
      <div class="kv">${esc(kindInfo(t.kind).label)}${t.sub ? " · " + esc(t.sub) : ""} · used by ${users.length} scenario${users.length === 1 ? "" : "s"}</div>
      <div class="sec">Used by</div>
      ${users.map((e) => `<div class="list-item" data-sel="s|${esc(e.s)}"><div class="t">${esc(scenarioName(e.s))}</div>
        <div class="s">${esc(e.label)}${e.ver ? ' · <span style="color:#6b4fd8">open new version</span>' : ""}${e.flag ? ' · <span style="color:#b86e00">flagged</span>' : ""}</div></div>`).join("")}

    </div>`;
  }
  if (sel.type === "p") {
    const ta = new Set(g.edges.filter((e) => e.s === sel.a).map((e) => e.t));
    const common = g.edges.filter((e) => e.s === sel.b && ta.has(e.t)).map((e) => e.t);
    return `<div class="sel-panel"><h3>${esc(scenarioName(sel.a))}<br><span class="muted" style="font-weight:400">and</span> ${esc(scenarioName(sel.b))}</h3>
      <div class="kv">share ${common.length} ${S.mapMode === "asset" ? "asset" : "component"}${common.length === 1 ? "" : "s"}</div>
      ${common.map((id) => `<div class="list-item" data-sel="t|${esc(id)}"><div class="t">${esc(tname(id))}</div><div class="s">${esc(g.targets.get(id)?.sub || "")}</div></div>`).join("") || '<div class="muted">Nothing in common.</div>'}
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn small" data-open="${esc(sel.a)}">Open first →</button><button class="btn small" data-open="${esc(sel.b)}">Open second →</button></div>
    </div>`;
  }
  return "";
}

/* ---- decisions across all scenarios ---- */
function decisionsTable() {
  const q = S.decQuery.trim().toLowerCase();
  const rows = [];
  for (const s of S.scenarios.values()) for (const d of s.latest.decisionList || []) {
    if (S.decOpenOnly && d.status === "completed") continue;
    const hay = [s.latest.name, d.label, d.on, d.option, d.why, d.what, d.who, ...d.refs.map(refName)].join(" ").toLowerCase();
    if (q && !hay.includes(q)) continue;
    rows.push({ s: s.latest, d });
  }
  rows.sort((a, b) => a.s.name.localeCompare(b.s.name) || String(b.d.when).localeCompare(String(a.d.when)));
  const nsc = new Set(rows.map((r) => r.s.id)).size;
  return `<div class="note" style="margin-bottom:6px">${rows.length} decision${rows.length === 1 ? "" : "s"} in ${nsc} scenario${nsc === 1 ? "" : "s"} · click a row to open the scenario</div>
  <table class="wtable"><thead><tr><th>Scenario</th><th>Decision</th><th>On</th><th>Change</th><th>Why</th><th>Who / when</th><th>Status</th></tr></thead><tbody>
  ${rows.map(({ s, d }, i) => `<tr class="row r ${d.warnings ? "attn" : ""}" style="--i:${i}" data-open="${esc(s.id)}">
    <td><b>${esc(s.name)}</b></td>
    <td>${esc(d.label)}${d.option ? ` <span class="chip">${esc(d.option)}</span>` : ""}${d.warnings ? ` <span class="chip amber">⚠ ${d.warnings}</span>` : ""}</td>
    <td>${esc(d.on)}${d.side ? `<div class="muted" style="font-size:12px">${esc(d.side)}</div>` : ""}</td>
    <td>${d.change.map((c) => `<span class="chip ${c === "breaking" ? "amber" : ""}">${esc(c === "nonBreaking" ? "non-breaking" : c)}</span>`).join("") || '<span class="muted">—</span>'}</td>
    <td>${d.why ? esc(d.why) : '<span class="muted">not given</span>'}</td>
    <td class="nowrap">${esc(d.who)}<div class="muted" style="font-size:12px">${esc(fmtDate(d.when))}</div></td>
    <td>${d.status === "completed" ? '<span class="chip done">completed</span>' : '<span class="chip violet">open</span>'}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">No decisions match.</td></tr>`}
  </tbody></table>`;
}

/* components that need attention: flagged in a scenario, or a version in use is deprecated / retired */
function attnRefs() {
  const m = new Map();
  const add = (ref, txt) => { if (!ref) return; if (!m.has(ref)) m.set(ref, []); if (!m.get(ref).includes(txt)) m.get(ref).push(txt); };
  for (const s of S.scenarios.values()) for (const f of activeFlags(s)) if (f.ref) add(f.ref, f.text);
  if (S.lifecycle) for (const x of S.refs.values()) for (const v of x.versions) {
    const st = S.lifecycle.byKey.get(x.ref + "@" + v)?.stage;
    if (st === "deprecated" || st === "retired") add(x.ref, `${v} is ${st}`);
  }
  return m;
}
function openDecisions() {
  const out = [];
  for (const s of S.scenarios.values()) for (const d of s.latest.decisionList || []) if (d.status !== "completed") out.push({ s: s.latest, d });
  return out;
}
function bandStats(k) {
  if (k === "sc") return { n: S.scenarios.size, a: [...S.scenarios.values()].filter((s) => activeFlags(s).length).length };
  if (k === "co") return { n: S.refs.size, a: attnRefs().size };

/* scenarios sharing components with this one, most shared first */
function overlapsOf(id) {
  const me = S.scenarios.get(id)?.latest; if (!me) return [];
  const mine = new Set(Object.keys(me.uses));
  const out = [];
  for (const o of S.scenarios.values()) {
    if (o.latest.id === id) continue;
    const shared = Object.keys(o.latest.uses).filter((r) => mine.has(r));
    if (shared.length) out.push({ id: o.latest.id, shared });
  }
  return out.sort((a, b) => b.shared.length - a.shared.length);
}

function orb(k, size) { const b = BANDS.find((x) => x.k === k); return `<span class="orb ${size || ""}" style="--c1:${b.c1};--c2:${b.c2}">${ICON[k]}</span>`; }

    co: `<path d="M100 20 170 58v84l-70 38-70-38V58z"/><path d="M30 58l70 38 70-38M100 96v84"/>`,
    de: `<circle cx="50" cy="30" r="12"/><circle cx="50" cy="170" r="12"/><circle cx="150" cy="70" r="12"/><path d="M50 42v116M150 82c0 40-50 30-95 76"/>`,
    map: `<circle cx="100" cy="100" r="18"/><circle cx="30" cy="30" r="12"/><circle cx="170" cy="30" r="12"/><circle cx="30" cy="170" r="12"/><circle cx="170" cy="170" r="12"/><path d="M40 40l46 46M160 40l-46 46M40 160l46-46M160 160l-46-46"/>` }[k];
  return `<svg class="deco" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" aria-hidden="true">${p}</svg>`;
}

function homeView() {

/* ---- the opening / closing transition (shared-element morph) ---- */
function openWorld(el, k) {
  // every band opens fresh: no filters left over from an earlier visit
  S.listQuery = ""; S.listFlagsOnly = false; S.compQuery = ""; S.compAttn = false; S.compShared = false; S.decQuery = ""; S.decOpenOnly = true;
  if (k === "map") S.sel = null;
  if (reduced() || !el.animate) return go("band", { k });
  window.scrollTo(0, 0);
  const r = el.getBoundingClientRect(), v = $("#view").getBoundingClientRect();
  $(".home")?.classList.add("recede");
  const mo = document.createElement("div");
  mo.className = "morph"; mo.innerHTML = worldHead(k);
  document.body.appendChild(mo);
  const from = { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", borderRadius: "22px" };
  const to = { left: v.left + "px", top: v.top + "px", width: v.width + "px", height: Math.max(320, innerHeight - v.top - 18) + "px", borderRadius: "20px" };
  Object.assign(mo.style, from);
  el.style.visibility = "hidden";
  mo.animate([from, to], { duration: 720, easing: EASE, fill: "forwards" }).onfinish = () => {
    go("band", { k }, { enter: true });
    mo.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, easing: "ease-out", fill: "forwards" }).onfinish = () => mo.remove();
  };
}
function closeWorld() {
  const k = S.param?.k, w = $(".world");
  if (reduced() || !w || !w.animate) return go("home");
  window.scrollTo(0, 0);
  const wr = w.getBoundingClientRect();
  go("home");
  const home = $(".home"), el = home?.querySelector(`[data-band="${k}"]`);
  if (!el) return;
  const r = el.getBoundingClientRect();
  home.classList.add("recede", "instant"); void home.offsetWidth; home.classList.remove("instant");
  const mo = document.createElement("div");
  mo.className = "morph"; mo.innerHTML = worldHead(k);
  document.body.appendChild(mo);
  const from = { left: wr.left + "px", top: wr.top + "px", width: wr.width + "px", height: Math.min(wr.height, innerHeight - wr.top - 18) + "px", borderRadius: "20px" };
  const to = { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", borderRadius: "22px" };
  el.style.visibility = "hidden";
  requestAnimationFrame(() => home.classList.remove("recede"));
  mo.animate([from, to], { duration: 600, easing: EASE, fill: "forwards" }).onfinish = () => {
    el.style.visibility = "";
    mo.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: "forwards" }).onfinish = () => mo.remove();
  };
}

/* ---- relationship explorer (per list row) ---- */
function explorerSvg(center, left, right, lt, rt) {
  const ROW = 34, H = Math.max(left.length, right.length, 1) * ROW + 40, cy = 26 + (H - 26) / 2;
  const W = 900, BW = 250, xL = 10, xR = W - BW - 10, cx = W / 2;
  const yOf = (i, n) => 30 + i * ROW + (H - 30 - n * ROW) / 2;
  let s = `<svg class="explorer" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Relationship explorer for ${esc(center.label)}">
    <text x="${xL}" y="16" class="xl">${esc(lt)}</text><text x="${xR}" y="16" class="xl">${esc(rt)}</text>`;
  left.forEach((it, i) => { const y = yOf(i, left.length);
    s += `<path d="M${xL + BW} ${y + 13} C${cx - 140} ${y + 13} ${cx - 160} ${cy} ${cx - 95} ${cy}" class="xe ${it.cls || ""}" />
      <g class="xn ${it.cls || ""}" ${it.attr || ""}><rect x="${xL}" y="${y}" width="${BW}" height="26" rx="7"/>
      <text x="${xL + 12}" y="${y + 17}">${esc(short(it.label, it.sub ? 26 : 34))}</text>${it.sub ? `<text x="${xL + BW - 10}" y="${y + 17}" text-anchor="end" class="xs">${esc(short(it.sub, 16))}</text>` : ""}<title>${esc(it.title || it.label)}</title></g>`; });
  right.forEach((it, i) => { const y = yOf(i, right.length);
    s += `<path d="M${cx + 95} ${cy} C${cx + 160} ${cy} ${cx + 140} ${y + 13} ${xR} ${y + 13}" class="xe ${it.cls || ""}" />
      <g class="xn ${it.cls || ""}" ${it.attr || ""}><rect x="${xR}" y="${y}" width="${BW}" height="26" rx="7"/>${it.col ? `<rect x="${xR}" y="${y}" width="5" height="26" rx="2" fill="${it.col}" stroke="none"/>` : ""}
      <text x="${xR + 14}" y="${y + 17}">${esc(short(it.label, it.sub ? 24 : 32))}</text>${it.sub ? `<text x="${xR + BW - 10}" y="${y + 17}" text-anchor="end" class="xs">${esc(short(it.sub, 18))}</text>` : ""}<title>${esc(it.title || it.label)}</title></g>`; });
  if (!left.length) s += `<text x="${xL}" y="${cy + 4}" class="xs">no overlap with other scenarios</text>`;
  s += `<g class="xc ${center.cls || ""}"><rect x="${cx - 95}" y="${cy - 20}" width="190" height="40" rx="10"/><text x="${cx}" y="${cy + 5}" text-anchor="middle">${esc(short(center.label, 24))}</text></g>`;
  return s + "</svg>";
}
function stripSvg(nLeft, rightCols, attn) {

  rightCols.slice(0, 5).forEach((c, i) => { const x = 78 + i * 12; s += `<line x1="70" y1="11" x2="${x}" y2="11"/><rect x="${x - 4}" y="7" width="8" height="8" rx="2" fill="${c}" stroke="none"/>`; });
  return s + `<circle cx="65" cy="11" r="6" class="me ${attn ? "attn" : ""}"/></svg>`;
}
function scExplorer(id) {
  const s = S.scenarios.get(id), r = s.latest, fl = flaggedRefs(s), ov = overlapsOf(id);
  const left = ov.slice(0, 8).map((o) => ({ label: scenarioName(o.id), sub: o.shared.length > 1 ? "shares " + o.shared.length : "shares 1",
